name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        env:
          LLM_PROVIDER: mock
          DATABASE_URL: sqlite:///./data/test.db
          CHROMA_DIR: ./data/test_chroma
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Build frontend
        run: npm run build
      - name: Install Chromium for browser smoke
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke
        run: npm run test:smoke

  deno-api:
    if: ${{ hashFiles('supabase/functions/api/**/*_test.ts', 'supabase/functions/api/**/*.test.ts') != '' }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      RATE_LIMIT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.4.5
      - name: Type-check API and tests
        run: deno check supabase/functions/api/index.ts supabase/functions/api/*_test.ts
      - name: Run Deno API tests
        run: deno test --allow-env --allow-net --allow-read supabase/functions/api/
